name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (46-test parity suite)
        run: npx vitest run

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r services/api/requirements.txt
      - name: API tests (CI-safe, no DBs)
        working-directory: services/api
        run: python -m pytest -q

  # Content-audit gate: needs the gitignored incoming/ exports, so it runs
  # only where a runner provides them (self-hosted / manual). Kept visible
  # so the gate isn't forgotten.
  content-audit:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_seed.py --files
