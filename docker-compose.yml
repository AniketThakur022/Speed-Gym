# VMSG dev stack — Postgres 15 + pgvector, Neo4j 5, Redis 7 (+ optional PgBouncer)
# DBs only:   docker compose up -d postgres neo4j redis
# Everything: docker compose --profile app up -d
services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: vmsg
      POSTGRES_PASSWORD: vmsg
      POSTGRES_DB: vmsg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmsg -d vmsg"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/vmsg-dev-password
      NEO4J_PLUGINS: '["apoc"]'
      # Phase-1 RAM caps (Droplet B budget — keep dev honest about prod limits)
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  pgbouncer:
    image: edoburu/pgbouncer:latest
    profiles: ["app"]
    environment:
      DB_USER: vmsg
      DB_PASSWORD: vmsg
      DB_HOST: postgres
      DB_NAME: vmsg
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "10000"
      DEFAULT_POOL_SIZE: "25"
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      - postgres

  api:
    profiles: ["app"]
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://vmsg:vmsg@postgres:5432/vmsg
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: vmsg-dev-password
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-change-me
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  game-server:
    profiles: ["app"]
    build: ./apps/game-server
    environment:
      JWT_SECRET: dev-only-change-me
      PORT: "3001"
      INTERNAL_API_URL: http://api:8000
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  pgdata:
  neo4jdata:
  redisdata:
