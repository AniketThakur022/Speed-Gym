# Production overrides:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
# DB ports are NOT published; secrets come from .env (gitignored); everything restarts.
#
# WHY EVERY SECRET IS RESTATED HERE: compose merges `environment:` maps and gives
# them precedence over `env_file:`. The base docker-compose.yml pins dev literals
# (JWT_SECRET: dev-only-change-me, POSTGRES_PASSWORD: vmsg, …), so an env_file
# alone is SILENTLY DISCARDED for those keys — prod would run on the secret that
# is committed to a public repo, and anyone could mint an admin token. Each key
# below is re-declared with `${VAR:?}` so it comes from .env and compose REFUSES
# to start if it is missing, instead of falling back to a dev default.
services:
  postgres:
    ports: []
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  neo4j:
    ports: []
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
  redis:
    ports: []
    restart: unless-stopped
  pgbouncer:
    ports: []
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  api:
    restart: unless-stopped
    env_file: .env
    environment:
      BEHIND_TLS: "true"
      DEBUG: "false"
      DATABASE_URL: postgresql://vmsg:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/vmsg
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OFFLINE_TOKEN_SECRET: ${OFFLINE_TOKEN_SECRET:?set OFFLINE_TOKEN_SECRET in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?set TRUSTED_PROXIES in .env (the reverse proxy IPs)}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
  game-server:
    restart: unless-stopped
    env_file: .env
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    volumes:
      - ./:/workspace
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vmsg:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/vmsg
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
      - neo4j
