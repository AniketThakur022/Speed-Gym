# Production overrides:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
# DB ports are NOT published; secrets come from .env (gitignored); everything restarts.
services:
  postgres:
    ports: []
    restart: unless-stopped
  neo4j:
    ports: []
    restart: unless-stopped
  redis:
    ports: []
    restart: unless-stopped
  pgbouncer:
    ports: []
    restart: unless-stopped
  api:
    restart: unless-stopped
    env_file: .env
    environment:
      BEHIND_TLS: "true"
      DEBUG: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
  game-server:
    restart: unless-stopped
    env_file: .env
  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    volumes:
      - ./:/workspace
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vmsg:vmsg@postgres:5432/vmsg
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
      - neo4j
